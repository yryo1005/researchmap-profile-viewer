<!--
  CMSの「埋め込みHTML」欄にこのままコピー＆ペーストしてください。
  書き換える箇所は下の data-permalink の値1箇所だけです。
  permalinkの調べ方はREADME.mdを参照してください。

  この <script> は、
  1) 高さをページ本文に合わせて自動調整する
  2) ページ上部の目次リンクをクリックしたときに、埋め込み先ページごとスクロールする
  ために使っています。埋め込み先のCMSがHTML欄内の<script>実行を許可している必要があります。

  CMSによっては、貼り付けたHTML内の<script>タグを元の位置とは別の場所に
  移動させてから実行する場合があります。そのため、この<script>はDOM上の
  位置関係（直前の要素など）には頼らず、data-permalink属性を持つiframeを
  ページ内から探して初期化する方式にしています。
-->
<iframe
  class="researchmap-profile-viewer"
  data-permalink="{{PERMALINK}}"
  style="width: 100%; border: 0; display: block;"
  loading="lazy"
  title="researchmap プロフィール"
></iframe>
<script>
  (function () {
    var BASE_URL = "https://yryo1005.github.io/researchmap-profile-viewer/";

    var iframes = document.querySelectorAll(
      ".researchmap-profile-viewer[data-permalink]:not([data-rmpv-initialized])"
    );

    for (var i = 0; i < iframes.length; i++) {
      (function (iframe) {
        iframe.setAttribute("data-rmpv-initialized", "true");
        var permalink = iframe.getAttribute("data-permalink");
        iframe.src = BASE_URL + "?permalink=" + encodeURIComponent(permalink);

        window.addEventListener("message", function (event) {
          if (!event.data || event.source !== iframe.contentWindow) return;

          if (event.data.type === "researchmap-profile-viewer:resize") {
            iframe.style.height = event.data.height + "px";
          }

          if (event.data.type === "researchmap-profile-viewer:scroll-to") {
            var iframeTop = iframe.getBoundingClientRect().top + window.scrollY;
            window.scrollTo({ top: iframeTop + event.data.top, behavior: "smooth" });
          }
        });
      })(iframes[i]);
    }
  })();
</script>
